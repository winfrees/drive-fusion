name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The read-only guarantee is a required status check, not a convention.
  # If this job fails, the tool may be able to modify catalogued media.
  guardrails:
    name: Guardrails (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt needs these to start even with the offscreen platform plugin, and
      # without them the GUI tests would skip — passing CI while testing nothing.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Read-only lint
        run: python tools/ro_lint.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # The GUI suite skips itself when Qt cannot start, so a green run proves
      # nothing about it unless Qt is known to work. Asserted directly rather
      # than inferred from the test output.
      - name: Assert Qt can start, so the GUI tests did not skip
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from tests.conftest import _qt_unavailable; r = _qt_unavailable(); sys.exit(0) if r is None else sys.exit('GUI tests would skip: ' + r)"

  build:
    name: Windows executable
    needs: guardrails
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Build one-folder executable
        run: pyinstaller packaging/drivefusion.spec --noconfirm --clean

      - name: Verify the built executables run
        run: |
          dist\DriveFusion\drivefusion.exe --version
          dist\DriveFusion\drivefusion.exe --help
          dist\DriveFusion\dfscan-helper.exe --help
          if (-not (Test-Path dist\DriveFusion\DriveFusion.exe)) {
            throw "the windowed executable was not built"
          }
          dist\DriveFusion\drivefusion.exe report --help

      - uses: actions/upload-artifact@v4
        with:
          name: DriveFusion-windows-x64
          path: dist/DriveFusion/
          retention-days: 14
