name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The read-only guarantee is a required status check, not a convention.
  # If this job fails, the tool may be able to modify catalogued media.
  guardrails:
    name: Guardrails (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Read-only lint
        run: python tools/ro_lint.py

      - name: Tests
        run: python -m pytest -q

  build:
    name: Windows executable
    needs: guardrails
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build one-folder executable
        run: pyinstaller packaging/drivefusion.spec --noconfirm --clean

      - name: Verify the built executables run
        run: |
          dist\DriveFusion\DriveFusion.exe --version
          dist\DriveFusion\DriveFusion.exe --help
          dist\DriveFusion\dfscan-helper.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: DriveFusion-windows-x64
          path: dist/DriveFusion/
          retention-days: 14
