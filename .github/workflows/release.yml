# A GitHub Release for each version tag. Push a tag `v<version>` (for example
# `git tag v0.1.0 && git push origin v0.1.0`) on a commit that is on main; this
# checks the tag against the package version, builds Windows with the same
# build-windows.yml as CI, and publishes the zip and its SHA-256 sums as a
# pre-release with notes generated from the merged PRs.
#
# Every release is a pre-release until the builds are signed (ROADMAP D21)
# and a release candidate has passed a physical-drive V&V run (PLAN §14,
# docs/REAL-DRIVE-TESTING.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tag names the version the build reports: v0.1.0, or v0.1.0-rc1 for
      # a candidate, of drivefusion 0.1.0.
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('drivefusion/__init__.py').read_text()).group(1))")
          case "$TAG" in
            "v$version"|"v$version"-*) echo "Tag $TAG is drivefusion $version." ;;
            *) echo "::error::Tag $TAG does not match drivefusion $version: tag v$version, or bump the version first."; exit 1 ;;
          esac

      # Only commits on main are released: they are the ones CI's guardrails
      # (the read-only lint and the full test suite) have already passed.
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Tag a commit on main."
            exit 1
          fi

  build:
    name: Windows executable
    needs: check
    uses: ./.github/workflows/build-windows.yml
    with:
      artifact-name: DriveFusion-${{ github.ref_name }}-windows-x64
      retention-days: 7
      summary: true
    secrets: inherit

  publish:
    name: Publish the pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      NAME: DriveFusion-${{ github.ref_name }}-windows-x64
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: DriveFusion

      - name: Package
        run: |
          zip -qr "$NAME.zip" DriveFusion
          {
            sha256sum "$NAME.zip"
            (cd DriveFusion && sha256sum DriveFusion.exe drivefusion.exe dfscan-helper.exe)
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notes
        run: |
          cat > notes.md <<EOF
          **Pre-release.** The executables are not code-signed yet (ROADMAP D21), so Windows
          SmartScreen will warn before the first run: choose *More info*, then *Run anyway*.

          Download \`$NAME.zip\`, check it against \`SHA256SUMS.txt\`
          (\`Get-FileHash $NAME.zip\` in PowerShell), unzip it anywhere and run \`DriveFusion.exe\`.
          Built from \`$GITHUB_SHA\`.
          EOF

      - name: Publish
        run: |
          gh release create "$TAG" "$NAME.zip" SHA256SUMS.txt \
            --verify-tag --prerelease --title "Drive Fusion $TAG" \
            --notes-file notes.md --generate-notes
